<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Myportal</title>
    <style>
        :root {
            --bg: #f4f7fc;
            --surface: #ffffff;
            --text: #344054;
            --muted: #8491a5;
            --border: #e5eaf2;
            --blue: #5299f5;
            --blue-soft: #e7effb;
            --coral: #ff8c8c;
            --yellow: #ffc857;
            --green: #77c9a5;
            --purple: #a98be8;
            --shadow: 0 3px 12px rgba(50, 80, 130, 0.09);
            --radius: 14px;
        }

        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            padding: 10px;
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN",
                         "Hiragino Sans", Meiryo, sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
        }

        .dashboard-container {
            display: grid;
            grid-template-columns: minmax(260px, 30%) minmax(0, 1fr);
            gap: 14px;
            width: 100%;
            height: 100%;
        }

        .left-column {
            display: flex;
            flex-direction: column;
            gap: 14px;
            min-height: 0;
            overflow: hidden;
        }

        .card {
            display: flex;
            flex-direction: column;
            min-height: 0;
            padding: 12px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .top-section, .bottom-section { flex: 1; }

        .right-column {
            min-width: 0;
            min-height: 0;
            height: 100%;
            padding: 0;
            background: transparent;
            border: 0;
            box-shadow: none;
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            min-height: 38px;
            margin-bottom: 10px;
            padding: 0 13px;
            color: #fff;
            background: linear-gradient(105deg, var(--blue), #78b5ff);
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: .02em;
            box-shadow: 0 2px 6px rgba(82, 153, 245, .18);
        }

        .top-section .card-header { background: linear-gradient(105deg, var(--purple), #c0a8f4); }
        .bottom-section .card-header { background: linear-gradient(105deg, var(--blue), #78b5ff); }

        h3 {
            margin: 9px 0 6px;
            padding-left: 9px;
            color: var(--text);
            border-left: 4px solid var(--coral);
            font-size: .82rem;
            font-weight: 700;
        }

        .embed-container {
            flex-grow: 1;
            width: 100%;
            min-height: 0;
            overflow: hidden;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 10px;
        }

        .embed-container iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .link-group {
            flex-grow: 1;
            min-height: 0;
            margin-bottom: 4px;
            padding-right: 4px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #cbd8eb transparent;
        }

        .btn {
            display: block;
            margin: 0 0 6px;
            padding: 8px 11px;
            border: 1px solid transparent;
            border-radius: 9px;
            text-decoration: none;
            font-size: .82rem;
            font-weight: 650;
            line-height: 1.35;
            transition: transform .16s ease, box-shadow .16s ease, background .16s ease;
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 3px 8px rgba(50, 80, 130, .10);
        }

        .btn-local {
            margin-left: 8px;
            color: #397bc9;
            background: var(--blue-soft);
            border-color: #c9defb;
        }

        .btn-local:hover { background: #dceaff; }

        .btn-web {
            color: #46556b;
            background: #f8faff;
            border-color: var(--border);
        }

        .btn-web:nth-of-type(2n) { border-left: 4px solid var(--green); }
        .btn-web:nth-of-type(2n+1) { border-left: 4px solid var(--yellow); }
        .btn-web:hover { background: #eef4ff; }

        @media (max-width: 900px) {
            body {
                height: auto;
                min-height: 100%;
                overflow: auto;
            }

            .dashboard-container {
                grid-template-columns: minmax(0, 1fr);
                height: auto;
            }

            .left-column { overflow: visible; }

            .top-section { min-height: 360px; }
            .bottom-section { min-height: 320px; }

            .right-column { height: 900px; }
        }

        @media (max-width: 520px) {
            body { padding: 7px; }
            .dashboard-container, .left-column { gap: 10px; }
            .card { padding: 9px; }
            .top-section { min-height: 320px; }
            .right-column { height: 850px; }
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        
        <!-- 左側エリア（全体割合 30%）：上下に分割 -->
        <div class="left-column">
            
            <!-- 上：ブックマーク画面 -->
            <section class="card top-section">
                <div class="card-header">
                    <span>Ｂｏｏｋｍａｒｋｓ</span>
                </div>
                <div class="embed-container" style="overflow: hidden; position: relative;">
                    <iframe src="https://nsokatg.github.io/bookmark/" title="Bookmarks" style="width: 111%; height: 111%; transform: scale(0.95); transform-origin: top left; border: none;"></iframe>
                </div>
            </section>

            <!-- 下：アプリ・ランチャーエリア -->
            <main class="card bottom-section">
                <div class="card-header">
                    <span>アプリ</span>
                </div>
                
                <div class="link-group" style="overflow-y: auto; flex-grow: 1; padding-right: 4px;">
                    <h3>ローカルアプリ</h3>
                    <a href="myapp://" class="btn btn-local">ＧＵＩを開く</a>
                    
                    <h3>ＷＥＢアプリ</h3>
                    <a href="https://github.com/" target="_blank" class="btn btn-web">github</a>
                    <a href="https://console.cloud.google.com/welcome?project=web-notes-508202" target="_blank" class="btn btn-web">Google Cloud</a>
                    <a href="https://drive.google.com/drive/home" target="_blank" class="btn btn-web">Google Drive</a>
                    <a href="https://nsokatg.github.io/Prompt_Maker/index.html" target="_blank" class="btn btn-web">Prompt_Maker</a>
                    <a href="https://nsokatg.github.io/Diary_Recorder/index.html" target="_blank" class="btn btn-web">Diary_Recorder</a>
                    <a href="https://nsokatg.github.io/GlyphAi/index.html" target="_blank" class="btn btn-web">GlyphAI</a>
                    <a href="https://nsokatg.github.io/Web_Memo/" target="_blank" class="btn btn-web">Web Memos</a>
                    <a href="https://nsokatg.github.io/PlaintextWriter/" target="_blank" class="btn btn-web">PlaintextWriter</a>
                    <a href="https://nsokatg.github.io/Household_accounts/index.html" target="_blank" class="btn btn-web">家計簿</a>
                </div>
            </main>

        </div>

        <!-- 右側エリア（残りスペース）：ダッシュボード本体 -->
        <aside class="right-column">
            <div class="embed-container" style="height: 100%;">
                <iframe src="https://nsokatg.github.io/myportal/dashboard.html" title="ダッシュボード"></iframe>
            </div>
        </aside>

    </div>

</body>
</html>
